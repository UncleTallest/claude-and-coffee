<!doctype html>
<html lang="en" class="theme-dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>
      {% if page.title %}{{ page.title }} | {{ site.title }}{% else %}{{
      site.title }}{% endif %}
    </title>
    <meta
      name="description"
      content="{% if page.description %}{{ page.description }}{% else %}{{ site.description }}{% endif %}"
    />
    <link
      rel="stylesheet"
      href="{{ '/assets/css/style.css' | relative_url }}"
    />
    <link
      rel="icon"
      type="image/png"
      href="{{ '/assets/images/favicon.png' | relative_url }}"
    />
  </head>
  <body>
    <header class="site-header">
      <nav class="nav">
        <a href="{{ '/' | relative_url }}" class="nav-brand-container">
          {% if site.logo and site.logo != "" %}
          <img src="{{ site.logo | relative_url }}" alt="" class="site-logo" />
          {% endif %}
          <span class="nav-brand">
            Claude & Coffee <span class="brand-accent">Austin</span>
          </span>
        </a>
        <div class="nav-links">
          <a
            href="{{ '/effective-claude-use/continuity/getting-started/why-guides/' | relative_url }}"
            >Guides</a
          >
          <a href="{{ '/resources/links/' | relative_url }}">Links</a>
          <a href="{{ '/resources/meetup-schedule/' | relative_url }}"
            >Schedule</a
          >
          <button class="theme-toggle" aria-label="Toggle theme">◐</button>
        </div>
      </nav>
    </header>

    <div class="site-main-wrapper">{{ content }}</div>

    <script>
      document.querySelector('.theme-toggle').addEventListener('click', () => {
        document.documentElement.classList.toggle('theme-light');
        document.documentElement.classList.toggle('theme-dark');
      });
    </script>
  </body>
</html>
